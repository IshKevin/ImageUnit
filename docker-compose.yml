version: '3.8'
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: imageunit
      POSTGRES_PASSWORD: imageunit
      POSTGRES_DB: imageunit
    ports: ["5440:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imageunit"]
      interval: 5s
      retries: 10
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6390:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: imageunit
      MINIO_ROOT_PASSWORD: imageunit-secret
    ports: ["9100:9000", "9101:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10
volumes: { pgdata: {}, redisdata: {}, miniodata: {} }
