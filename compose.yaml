# ImageUnit — one compose file for everything.
#
#   docker compose up -d --build            # web + API + worker + Postgres + Redis + S3 storage, on localhost
#   docker compose --profile https up -d    # ...plus Caddy with automatic HTTPS (production, see docs/RUNBOOK.md)
#
# Requires Docker Compose v2 (`docker compose`). The legacy Python `docker-compose` v1 rejects this file on purpose:
# it crashes and destroys containers on current Docker versions.
#
# Configuration comes from .env (local) or `--env-file .env.production` (see `make prod-up`). No host ports are
# published here (so it also deploys on platforms like Coolify that route by domain); compose.override.yaml, which
# `docker compose` loads automatically, publishes them on 127.0.0.1 for local use and backups.
name: imageunit

x-app: &app
  restart: unless-stopped
  init: true
  # Every setting is listed here so the file works the same under plain Docker Compose (values from .env /
  # --env-file) and under platforms such as Coolify that inject variables only through interpolation.
  environment:
    NODE_ENV: ${NODE_ENV:-development}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    PORT: "4000"
    PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:4001}
    CORS_ORIGINS: ${CORS_ORIGINS:-}
    ORIGIN_CHECK: ${ORIGIN_CHECK:-}
    API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:4000}
    COOKIE_SECURE: ${COOKIE_SECURE:-}
    TRUST_PROXY: ${TRUST_PROXY:-}
    SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET (openssl rand -hex 32)}
    METRICS_TOKEN: ${METRICS_TOKEN:-}
    LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
    BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
    BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    STORAGE_TOTAL_BYTES: ${STORAGE_TOTAL_BYTES:-10995116502016}
    MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
    MAX_VIDEO_BYTES: ${MAX_VIDEO_BYTES:-2147483648}
    WORKER_VIDEO_CONCURRENCY: ${WORKER_VIDEO_CONCURRENCY:-1}
    WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    # Inside the compose network the services are reached by name.
    DATABASE_URL: postgres://imageunit:${POSTGRES_PASSWORD:-imageunit}@postgres:5432/imageunit
    REDIS_URL: redis://:${REDIS_PASSWORD:-imageunit}@redis:6379
    S3_ENDPOINT: http://s3:8333
    S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:8333}
    S3_REGION: ${S3_REGION:-us-east-1}
    S3_BUCKET: ${S3_BUCKET:-imageunit-media}
    S3_FORCE_PATH_STYLE: "true"
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-imageunit}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-imageunit-secret}
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    s3: { condition: service_healthy }

services:
  # ---------- application ----------
  api:
    <<: *app
    build: { context: ., dockerfile: apps/api/Dockerfile }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    <<: *app
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["node", "dist/worker.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    # Scale for big upload bursts: docker compose up -d --scale worker=3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: { API_URL: "http://api:4000" }
    # Server-rendered pages (public galleries) call the API at runtime, not just the build-time proxy rules.
    environment: { API_URL: "http://api:4000" }
    expose: ["4001"]
    restart: unless-stopped
    init: true
    depends_on: { api: { condition: service_healthy } }

  # ---------- infrastructure ----------
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: imageunit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-imageunit}
      POSTGRES_DB: imageunit
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U imageunit"], interval: 5s, retries: 12 }

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-imageunit}"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD:-imageunit}\" --no-auth-warning ping | grep -q PONG"], interval: 5s, retries: 12 }

  # S3-compatible object storage (SeaweedFS: Apache-2.0, actively maintained; replaces the archived MinIO).
  # Browsers upload/download directly through presigned URLs, so this must be reachable at S3_PUBLIC_ENDPOINT.
  s3:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-imageunit}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-imageunit-secret}
    command:
      - server
      - -dir=/data
      - -ip=s3
      - -ip.bind=0.0.0.0
      - -s3
      - -s3.port=8333
      # Browser CORS for the storage gateway. Every upload/download URL is already signed and short-lived, so access is
      # controlled by the signature, not by the page's origin; a CORS list tied to PUBLIC_WEB_URL only caused
      # "network error" uploads whenever that setting was off. Default: any site. Restrict with S3_CORS_ORIGINS.
      - -s3.allowedOrigins=${S3_CORS_ORIGINS:-${CORS_ORIGINS:-*}}
      - -master.volumeSizeLimitMB=1024
    volumes: [s3data:/data]
    # Any HTTP answer (even 403 for an unsigned request) means the S3 gateway is listening.
    healthcheck: { test: ["CMD-SHELL", "wget -q -S --spider http://localhost:8333/ 2>&1 | grep -q 'HTTP/'"], interval: 5s, timeout: 5s, retries: 20, start_period: 10s }

  # ---------- HTTPS reverse proxy (production only: --profile https) ----------
  caddy:
    profiles: [https]
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment: { DOMAIN: "${DOMAIN:-localhost}" }
    volumes: [./ops/Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data, caddy_config:/config]
    depends_on: [web, api, s3]

volumes:
  pgdata: {}
  redisdata: {}
  s3data: {}
  caddy_data: {}
  caddy_config: {}
