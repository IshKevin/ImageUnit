# Production deployment. Single server with everything self-hosted:
#   docker compose -f docker-compose.prod.yml --env-file .env.production --profile selfhosted up -d --build
# Managed Postgres/Redis/S3: point the URLs in .env.production at them and omit `--profile selfhosted`
# (then terminate TLS with your own load balancer instead of the bundled Caddy).
name: imageunit-prod

x-app: &app
  env_file: .env.production
  restart: unless-stopped
  init: true

services:
  api:
    <<: *app
    build: { context: ., dockerfile: apps/api/Dockerfile }
    expose: ["4000"]
    depends_on:
      # required:false lets these be omitted when using managed services (no `selfhosted` profile).
      postgres: { condition: service_healthy, required: false }
      redis: { condition: service_healthy, required: false }
      minio: { condition: service_healthy, required: false }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *app
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["node", "dist/worker.js"]
    depends_on:
      # required:false lets these be omitted when using managed services (no `selfhosted` profile).
      postgres: { condition: service_healthy, required: false }
      redis: { condition: service_healthy, required: false }
      minio: { condition: service_healthy, required: false }
    deploy: { replicas: 1 }   # raise for large upload bursts

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile, args: { API_URL: "http://api:4000" } }
    restart: unless-stopped
    init: true
    expose: ["4001"]
    depends_on: { api: { condition: service_healthy } }

  # ---------- self-hosted infrastructure ----------
  postgres:
    profiles: [selfhosted]
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: imageunit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: imageunit
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U imageunit"], interval: 5s, retries: 10 }

  redis:
    profiles: [selfhosted]
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"], interval: 5s, retries: 10 }
    environment: { REDIS_PASSWORD: "${REDIS_PASSWORD}" }

  minio:
    profiles: [selfhosted]
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [miniodata:/data]
    healthcheck: { test: ["CMD", "mc", "ready", "local"], interval: 5s, retries: 10 }

  caddy:
    profiles: [selfhosted]
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment: { DOMAIN: "${DOMAIN}" }
    volumes: [./ops/Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data, caddy_config:/config]
    depends_on: [web, api, minio]

volumes: { pgdata: {}, redisdata: {}, miniodata: {}, caddy_data: {}, caddy_config: {} }
